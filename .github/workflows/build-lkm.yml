name: Build YAAP KernelSU LKM

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, or auto for UTC date plus run number
        required: false
        default: auto
        type: string
      publish_release:
        description: Publish the available .ko files as a GitHub release
        required: false
        default: true
        type: boolean
      module_sig_protect:
        description: Keep YAAP GKI module protection (y matches the stock config)
        required: false
        default: y
        type: choice
        options:
          - n
          - y
      backslashxx_branch_link:
        description: Enable backslashxx inline worker (disable to investigate CPU identity mismatch)
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-yaap-lkm-${{ github.ref }}
  cancel-in-progress: false

env:
  ARCH: arm64
  KERNEL_REPO: https://github.com/AkiHaza/android_kernel_oneplus_sm8650.git
  KERNEL_REF: seventeen
  MODULES_REPO: https://github.com/AkiHaza/android_kernel_oneplus_sm8650-modules.git
  MODULES_REF: seventeen
  TOOLCHAIN_URL: https://github.com/AkiHaza/Floran-Kernel/releases/download/toolchain-r596125/linux-x86-refs_heads_android17-release-clang-r596125.tar.gz
  KSU_REF: main
  KSU_NEXT_REF: dev
  BAKASU_REF: main
  KOWX712_REF: master
  BACKSLASHXX_REF: master

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Resolve release metadata
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euxo pipefail
          if [ -z "$REQUESTED_TAG" ] || [ "$REQUESTED_TAG" = auto ]; then
            tag="$(date -u +%F)-${GITHUB_RUN_NUMBER}"
          else
            tag="$REQUESTED_TAG"
          fi
          case "$tag" in
            *[!A-Za-z0-9._-]*) echo "Invalid release tag: $tag" >&2; exit 1;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  kernel:
    name: Prepare YAAP kernel (once)
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      kernel_commit: ${{ steps.source.outputs.kernel_commit }}
      modules_commit: ${{ steps.source.outputs.modules_commit }}
      kernel_release: ${{ steps.kernel_build.outputs.kernel_release }}
    steps:
      - name: Checkout workflow and patches
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify checked-out repository files
        run: |
          set -euxo pipefail
          test -n "${GITHUB_SHA:-}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .github/workflows/build-lkm.yml
          test -s patches/backslashxx/0001-preserve-sucompat-syscall-fallback.patch
          test -s patches/backslashxx/0002-disable-arm64-branch-link-worker.patch
          test -s scripts/check-backslashxx-fallback.py
          git diff --check

      - name: Setup swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libdw-dev libelf-dev libssl-dev pahole \
            binutils cpio kmod lz4 rsync python3 python3-pip git jq xz-utils

      - name: Download YAAP clang-r596125
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/toolchain"
          curl --fail --location --retry 5 --retry-all-errors \
            "$TOOLCHAIN_URL" -o "$RUNNER_TEMP/clang.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$RUNNER_TEMP/toolchain"
          clang_bin="$(find "$RUNNER_TEMP/toolchain" -path '*/bin/clang' \( -type f -o -type l \) -print -quit)"
          test -n "$clang_bin" -a -x "$clang_bin"
          dirname "$clang_bin" >> "$GITHUB_PATH"
          echo "CLANG_BIN=$(dirname "$clang_bin")" >> "$GITHUB_ENV"
          "$clang_bin" --version

      - name: Clone YAAP kernel and modules
        id: source
        env:
          KERNEL_DIR: ${{ runner.temp }}/sm8650
          MODULES_DIR: ${{ runner.temp }}/sm8650-modules
        run: |
          set -euxo pipefail
          clone_latest() {
            local repo="$1" ref="$2" dir="$3"
            local expected_sha
            expected_sha="$(git ls-remote --exit-code "$repo" "refs/heads/$ref" | awk 'NR == 1 { print $1 }')"
            test -n "$expected_sha"
            git clone --filter=blob:none --no-tags --depth=1 --single-branch \
              --branch "$ref" "$repo" "$dir"
            test "$(git -C "$dir" rev-parse HEAD)" = "$expected_sha"
            printf '%s\n' "$expected_sha"
          }
          kernel_commit="$(clone_latest "$KERNEL_REPO" "$KERNEL_REF" "$KERNEL_DIR")"
          modules_commit="$(clone_latest "$MODULES_REPO" "$MODULES_REF" "$MODULES_DIR")"
          touchpanel_link="$KERNEL_DIR/drivers/base/touchpanel_notify"
          test -L "$touchpanel_link"
          test "$(readlink "$touchpanel_link")" = \
            "../../../sm8650-modules/oplus/kernel/touchpanel/touchpanel_notify"
          test -f "$touchpanel_link/Kconfig"
          test -f "$touchpanel_link/Makefile"
          {
            echo "KERNEL_COMMIT=$kernel_commit"
            echo "MODULES_COMMIT=$modules_commit"
            echo "KERNEL_DIR=$KERNEL_DIR"
            echo "MODULES_DIR=$MODULES_DIR"
          } >> "$GITHUB_ENV"
          echo "kernel_commit=$kernel_commit" >> "$GITHUB_OUTPUT"
          echo "modules_commit=$modules_commit" >> "$GITHUB_OUTPUT"
          {
            echo "### Source revisions"
            echo "- kernel ($KERNEL_REF): \`$kernel_commit\`"
            echo "- modules ($MODULES_REF): \`$modules_commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare YAAP kernel configuration
        env:
          MODULE_SIG_PROTECT: ${{ inputs.module_sig_protect }}
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["KERNEL_DIR"]) / "certs/extract-cert.c"
          text = path.read_text()
          guarded_decl = """#ifdef USE_PKCS11_ENGINE
          static const char *key_pass;
          #endif"""
          guarded_assignment = """#ifdef USE_PKCS11_ENGINE
          \tkey_pass = getenv("KBUILD_SIGN_PIN");
          #endif"""
          declaration = "static const char *key_pass;"
          assignment = '\tkey_pass = getenv("KBUILD_SIGN_PIN");'
          if guarded_decl in text and guarded_assignment in text:
              text = text.replace(guarded_decl, declaration, 1)
              text = text.replace(guarded_assignment, assignment, 1)
              path.write_text(text)
          elif not (guarded_decl in text or guarded_assignment in text) \
                  and declaration in text and assignment in text:
              pass
          else:
              raise SystemExit("Unsupported extract-cert.c key_pass layout")
          PY
          mkdir -p "$RUNNER_TEMP/yaap-out"
          make -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 gki_defconfig
          KCONFIG_CONFIG="$RUNNER_TEMP/yaap-out/.config" \
            "$KERNEL_DIR/scripts/kconfig/merge_config.sh" -m -r -y \
            "$RUNNER_TEMP/yaap-out/.config" \
            "$KERNEL_DIR/arch/arm64/configs/vendor/pineapple_GKI.config" \
            "$KERNEL_DIR/arch/arm64/configs/vendor/oplus/pineapple_GKI.config"
          if [ "$MODULE_SIG_PROTECT" = n ]; then
            "$KERNEL_DIR/scripts/config" --file "$RUNNER_TEMP/yaap-out/.config" \
              --disable MODULE_SIG_PROTECT
          fi
          make -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 olddefconfig
          if [ "$MODULE_SIG_PROTECT" = y ]; then
            grep -q '^CONFIG_MODULE_SIG_PROTECT=y$' "$RUNNER_TEMP/yaap-out/.config"
          else
            grep -Eq '^# CONFIG_MODULE_SIG_PROTECT is not set$|^CONFIG_MODULE_SIG_PROTECT=n$' \
              "$RUNNER_TEMP/yaap-out/.config"
          fi
          for symbol in MODULES KALLSYMS KALLSYMS_ALL SECCOMP SECCOMP_FILTER KPROBES EXT4_FS HAVE_SYSCALL_TRACEPOINTS; do
            grep -q "^CONFIG_${symbol}=y$" "$RUNNER_TEMP/yaap-out/.config" || {
              echo "CONFIG_${symbol}=y is required by the selected KernelSU LKM variants" >&2
              exit 1
            }
          done
          if grep -q '^CONFIG_TRIM_UNUSED_KSYMS=y$' "$RUNNER_TEMP/yaap-out/.config"; then
            echo 'CONFIG_TRIM_UNUSED_KSYMS=y is incompatible with a standalone KernelSU LKM' >&2
            exit 1
          fi
          if grep -q '^CONFIG_MODULE_SIG_ALL=y$' "$RUNNER_TEMP/yaap-out/.config"; then
            echo 'CONFIG_MODULE_SIG_ALL=y would invalidate signatures when stripping debug data' >&2
            exit 1
          fi
          if grep -q '^CONFIG_MODULE_SIG_FORCE=y$' "$RUNNER_TEMP/yaap-out/.config"; then
            echo 'CONFIG_MODULE_SIG_FORCE=y rejects the unsigned standalone LKMs' >&2
            exit 1
          fi
          grep -E '^(CONFIG_(KPROBES|JUMP_LABEL|MODULES|MODULE_UNLOAD|MODVERSIONS|MODULE_SIG|MODULE_SIG_PROTECT|KALLSYMS|KALLSYMS_ALL|TRIM_UNUSED_KSYMS|CFI_CLANG|LTO_CLANG_THIN|DEBUG_INFO_BTF|EXT4_FS|HAVE_SYSCALL_TRACEPOINTS|SECURITY_SELINUX|SECCOMP|SECCOMP_FILTER))=' \
            "$RUNNER_TEMP/yaap-out/.config" | tee "$RUNNER_TEMP/yaap-config.txt"

      - name: Build YAAP kernel symbols
        id: kernel_build
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          make -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image modules
          make -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 modules_prepare
          test -s "$RUNNER_TEMP/yaap-out/Module.symvers"
          test -s "$RUNNER_TEMP/yaap-out/vmlinux"
          test -s "$RUNNER_TEMP/yaap-out/include/config/kernel.release"
          test -s "$RUNNER_TEMP/yaap-out/include/config/auto.conf"
          grep -q '^CONFIG_MODVERSIONS=y$' "$RUNNER_TEMP/yaap-out/.config"
          echo "kernel_release=$(cat "$RUNNER_TEMP/yaap-out/include/config/kernel.release")" >> "$GITHUB_OUTPUT"

      - name: Prepare KernelSU module linker
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          modpost="$KERNEL_DIR/scripts/mod/modpost.c"
          test -f "$modpost"
          grep -Fq 'if (fnmatch("*kernelsu", mod->name, 0))' "$modpost"
          grep -Fq 's->module = exp->module;' "$modpost"
          sed -i '/^[[:space:]]*if (fnmatch("\*kernelsu", mod->name, 0))$/d' "$modpost"
          sed -i -E 's/^([[:space:]]*)check_exports\(mod\);/\1\/\/ check_exports(mod);/' "$modpost"
          sed -i -E 's/^([[:space:]]*)s->module = exp->module;/\1\/\/ s->module = exp->module;/' "$modpost"
          sed -i 's/^static void check_exports(/static void __attribute__((unused)) check_exports(/' "$modpost"
          if grep -q '__version_ext_names") = $' "$modpost"; then
            sed -i 's/__version_ext_names") =$/__version_ext_names") = ""/' "$modpost"
          fi
          if grep -Eq '^[[:space:]]*(check_exports\(mod\);|s->module = exp->module;)' "$modpost"; then
            echo 'KernelSU modpost compatibility patch did not apply' >&2
            exit 1
          fi
          echo 'KBUILD_MODPOST_WARN=1' >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/yaap-out/scripts/mod/modpost" \
            "$RUNNER_TEMP/yaap-out/scripts/mod/modpost.o"
          make -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 prepare0
          test -x "$RUNNER_TEMP/yaap-out/scripts/mod/modpost"

      - name: Archive prepared kernel context
        run: |
          set -euxo pipefail
          # External module builds need generated headers, Module.symvers,
          # vmlinux and host helpers, but not the kernel's intermediate objects.
          find "$RUNNER_TEMP/yaap-out" -type f \( -name '*.ko' -o -name '*.o' -o -name '*.a' \) -delete
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/yaap-kernel-context.tar.gz" yaap-out

      - name: Upload prepared kernel context
        uses: actions/upload-artifact@v4
        with:
          name: yaap-kernel-context
          path: |
            ${{ runner.temp }}/yaap-kernel-context.tar.gz
            ${{ runner.temp }}/yaap-config.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload kernel diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: yaap-kernel-diagnostics
          path: ${{ runner.temp }}/yaap-config.txt
          if-no-files-found: error
          retention-days: 30

  build-ksu:
    name: Build ${{ matrix.variant }} LKM
    needs: [metadata, kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: kernelsu
            repo: https://github.com/tiann/KernelSU.git
            ref: main
            source_dir: kernelsu
            module_dir: kernel
            module_file: kernelsu.ko
          - variant: kernelsu_next
            repo: https://github.com/KernelSU-Next/KernelSU-Next.git
            ref: dev
            source_dir: kernelsu-next
            module_dir: kernel
            module_file: kernelsu.ko
          - variant: bakasu
            repo: https://github.com/Baka-SU/BakaSU.git
            ref: main
            source_dir: bakasu
            module_dir: kernel
            module_file: kernelsu.ko
          - variant: kowx712
            repo: https://github.com/KOWX712/KernelSU.git
            ref: master
            source_dir: kowx712
            module_dir: kernel
            module_file: kernelsu.ko
          - variant: backslashxx
            repo: https://github.com/backslashxx/KernelSU.git
            ref: master
            source_dir: backslashxx
            module_dir: kernel
            module_file: ksu.ko
    steps:
      - name: Checkout workflow and patches
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libdw-dev libelf-dev libssl-dev pahole \
            binutils cpio kmod lz4 rsync python3 git jq xz-utils

      - name: Setup swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Download YAAP clang-r596125
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/toolchain"
          curl --fail --location --retry 5 --retry-all-errors \
            "$TOOLCHAIN_URL" -o "$RUNNER_TEMP/clang.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$RUNNER_TEMP/toolchain"
          clang_bin="$(find "$RUNNER_TEMP/toolchain" -path '*/bin/clang' \( -type f -o -type l \) -print -quit)"
          test -n "$clang_bin" -a -x "$clang_bin"
          echo "CLANG_BIN=$(dirname "$clang_bin")" >> "$GITHUB_ENV"

      - name: Download prepared kernel context
        uses: actions/download-artifact@v4
        with:
          name: yaap-kernel-context
          path: ${{ runner.temp }}/kernel-artifact

      - name: Restore kernel source and output
        env:
          KERNEL_DIR: ${{ runner.temp }}/sm8650
          MODULES_DIR: ${{ runner.temp }}/sm8650-modules
          KERNEL_COMMIT: ${{ needs.kernel.outputs.kernel_commit }}
          MODULES_COMMIT: ${{ needs.kernel.outputs.modules_commit }}
        run: |
          set -euxo pipefail
          clone_commit() {
            local repo="$1" commit="$2" dir="$3"
            git init "$dir"
            git -C "$dir" remote add origin "$repo"
            git -C "$dir" fetch --filter=blob:none --depth=1 origin "$commit"
            git -C "$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$commit"
          }
          clone_commit "$KERNEL_REPO" "$KERNEL_COMMIT" "$KERNEL_DIR"
          clone_commit "$MODULES_REPO" "$MODULES_COMMIT" "$MODULES_DIR"
          touchpanel_link="$KERNEL_DIR/drivers/base/touchpanel_notify"
          test -L "$touchpanel_link"
          test "$(readlink "$touchpanel_link")" = \
            "../../../sm8650-modules/oplus/kernel/touchpanel/touchpanel_notify"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/kernel-artifact/yaap-kernel-context.tar.gz"
          test -s "$RUNNER_TEMP/yaap-out/Module.symvers"
          test -s "$RUNNER_TEMP/yaap-out/vmlinux"
          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"
          echo "MODULES_DIR=$MODULES_DIR" >> "$GITHUB_ENV"
          echo "KBUILD_MODPOST_WARN=1" >> "$GITHUB_ENV"

      - name: Restore patched KernelSU modpost
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          modpost="$KERNEL_DIR/scripts/mod/modpost.c"
          grep -Fq 'if (fnmatch("*kernelsu", mod->name, 0))' "$modpost"
          grep -Fq 's->module = exp->module;' "$modpost"
          sed -i '/^[[:space:]]*if (fnmatch("\*kernelsu", mod->name, 0))$/d' "$modpost"
          sed -i -E 's/^([[:space:]]*)check_exports\(mod\);/\1\/\/ check_exports(mod);/' "$modpost"
          sed -i -E 's/^([[:space:]]*)s->module = exp->module;/\1\/\/ s->module = exp->module;/' "$modpost"
          sed -i 's/^static void check_exports(/static void __attribute__((unused)) check_exports(/' "$modpost"
          if grep -q '__version_ext_names") = $' "$modpost"; then
            sed -i 's/__version_ext_names") =$/__version_ext_names") = ""/' "$modpost"
          fi
          rm -f "$RUNNER_TEMP/yaap-out/scripts/mod/modpost" \
            "$RUNNER_TEMP/yaap-out/scripts/mod/modpost.o"
          make -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 prepare0
          test -x "$RUNNER_TEMP/yaap-out/scripts/mod/modpost"

      - name: Clone selected KernelSU source
        env:
          KSU_REPO: ${{ matrix.repo }}
          KSU_REF_SELECTED: ${{ matrix.ref }}
          KSU_DIR: ${{ runner.temp }}/${{ matrix.source_dir }}
        run: |
          set -euxo pipefail
          expected_sha="$(git ls-remote --exit-code "$KSU_REPO" "refs/heads/$KSU_REF_SELECTED" | awk 'NR == 1 { print $1 }')"
          test -n "$expected_sha"
          git clone --filter=blob:none --no-tags --depth=1 --single-branch \
            --branch "$KSU_REF_SELECTED" "$KSU_REPO" "$KSU_DIR"
          test "$(git -C "$KSU_DIR" rev-parse HEAD)" = "$expected_sha"
          if [ "${{ matrix.variant }}" = bakasu ] || [ "${{ matrix.variant }}" = kowx712 ]; then
            git -C "$KSU_DIR" fetch --unshallow
          fi
          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "KSU_COMMIT=$expected_sha" >> "$GITHUB_ENV"

      - name: Patch backslashxx ARM64 sucompat fallback
        if: ${{ matrix.variant == 'backslashxx' }}
        env:
          BACKSLASHXX_BRANCH_LINK: ${{ inputs.backslashxx_branch_link }}
        run: |
          set -euxo pipefail
          patch_file="$GITHUB_WORKSPACE/patches/backslashxx/0001-preserve-sucompat-syscall-fallback.patch"
          worker_patch="$GITHUB_WORKSPACE/patches/backslashxx/0002-disable-arm64-branch-link-worker.patch"
          source_file="$KSU_DIR/kernel/hook/branch_link_hook_arm64.c"
          fallback_patch_name=""
          if git -C "$KSU_DIR" apply --check "$patch_file"; then
            git -C "$KSU_DIR" apply --whitespace=error "$patch_file"
            grep -Fq 'int ret = -ENOENT;' "$source_file"
            grep -Fq 'if (!ret) {' "$source_file"
            fallback_patch_name=0001-preserve-sucompat-syscall-fallback
            fallback_status=patched
          else
            python3 "$GITHUB_WORKSPACE/scripts/check-backslashxx-fallback.py" "$source_file"
            fallback_status=upstream
          fi
          worker_patch_name=""
          if [ "$BACKSLASHXX_BRANCH_LINK" = false ]; then
            git -C "$KSU_DIR" apply --check "$worker_patch"
            git -C "$KSU_DIR" apply --whitespace=error "$worker_patch"
            if grep -Fq 'kthread_run(bl_hack_init_thread' "$source_file"; then
              echo 'backslashxx branch-link worker is still enabled' >&2
              exit 1
            fi
            grep -Fq 'syscall_table_ksud_hook_init();' "$source_file"
            grep -Fq 'syscall_table_sucompat_enable();' "$source_file"
            worker_patch_name=0002-disable-arm64-branch-link-worker
          else
            grep -Fq 'kthread_run(bl_hack_init_thread' "$source_file"
          fi
          git -C "$KSU_DIR" diff --check
          {
            echo "BACKSLASHXX_PATCH=$fallback_patch_name"
            echo "BACKSLASHXX_FALLBACK=$fallback_status"
            echo "BACKSLASHXX_WORKER_PATCH=$worker_patch_name"
            echo "BACKSLASHXX_BRANCH_LINK=$BACKSLASHXX_BRANCH_LINK"
          } >> "$GITHUB_ENV"

      - name: Build selected KernelSU LKM
        env:
          VARIANT: ${{ matrix.variant }}
          MODULE_DIR: ${{ matrix.module_dir }}
          MODULE_FILE: ${{ matrix.module_file }}
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          make_args=(
            -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH"
            LLVM=1 LLVM_IAS=1 M="$KSU_DIR/$MODULE_DIR"
            src="$KSU_DIR/$MODULE_DIR" CONFIG_KSU=m
          )
          if [ "$VARIANT" = bakasu ]; then
            make_args+=(CONFIG_KSU_TRACEPOINT_HOOK=y CONFIG_KSU_MANUAL_HOOK=n
              CONFIG_KSU_MULTI_MANAGER_SUPPORT=y CONFIG_KSU_SUSFS=n)
          fi
          make "${make_args[@]}" modules
          test -s "$KSU_DIR/$MODULE_DIR/$MODULE_FILE"

      - name: Validate and package selected LKM
        env:
          VARIANT: ${{ matrix.variant }}
          MODULE_DIR: ${{ matrix.module_dir }}
          MODULE_FILE: ${{ matrix.module_file }}
          BACKSLASHXX_BRANCH_LINK: ${{ inputs.backslashxx_branch_link }}
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          ko="$KSU_DIR/$MODULE_DIR/$MODULE_FILE"
          kernel_release="$(cat "$RUNNER_TEMP/yaap-out/include/config/kernel.release")"
          test -x "$CLANG_BIN/llvm-strip"
          test "$(readelf -h "$ko" | awk -F: '/Machine:/ {gsub(/^[[:space:]]+/, "", $2); print $2}')" = AArch64
          vermagic="$(modinfo -F vermagic "$ko")"
          case "$vermagic" in
            "$kernel_release"*) ;;
            *) echo "vermagic mismatch for $ko: $vermagic (kernel $kernel_release)" >&2; exit 1;;
          esac
          case " $vermagic " in
            *" modversions "*) ;;
            *) echo "missing modversions vermagic flag for $ko: $vermagic" >&2; exit 1;;
          esac
          checker_source="$KSU_DIR/kernel/tools/check_symbol.c"
          if [ ! -s "$checker_source" ]; then
            # backslashxx does not carry the checker; only that variant needs
            # this fallback, so an official-source outage cannot block the
            # other matrix children.
            git clone --filter=blob:none --no-tags --depth=1 --single-branch \
              --branch "$KSU_REF" https://github.com/tiann/KernelSU.git \
              "$RUNNER_TEMP/kernelsu-checker"
            checker_source="$RUNNER_TEMP/kernelsu-checker/kernel/tools/check_symbol.c"
          fi
          test -s "$checker_source"
          cc "$checker_source" -o "$RUNNER_TEMP/check_symbol"
          "$RUNNER_TEMP/check_symbol" "$ko" "$RUNNER_TEMP/yaap-out/vmlinux"
          original_bytes="$(stat -c %s "$ko")"
          "$CLANG_BIN/llvm-strip" --strip-debug "$ko"
          stripped_bytes="$(stat -c %s "$ko")"
          mkdir -p "$RUNNER_TEMP/variant-package"
          cp "$ko" "$RUNNER_TEMP/variant-package/$VARIANT.ko"
          modinfo "$ko" > "$RUNNER_TEMP/variant-package/$VARIANT.modinfo"
          branch_link_json=null
          if [ "$VARIANT" = backslashxx ]; then
            branch_link_json="${BACKSLASHXX_BRANCH_LINK:-null}"
          fi
          jq -n \
            --arg variant "$VARIANT" \
            --arg ref "${{ matrix.ref }}" \
            --arg commit "$KSU_COMMIT" \
            --arg module "$VARIANT.ko" \
            --arg kernel_release "$kernel_release" \
            --arg original_bytes "$original_bytes" \
            --arg stripped_bytes "$stripped_bytes" \
            --arg backslashxx_fallback "${BACKSLASHXX_FALLBACK:-}" \
            --arg backslashxx_patch "${BACKSLASHXX_PATCH:-}" \
            --argjson backslashxx_branch_link "$branch_link_json" \
            '{variant:$variant,ref:$ref,commit:$commit,module:$module,kernel_release:$kernel_release,original_bytes:($original_bytes|tonumber),stripped_bytes:($stripped_bytes|tonumber),backslashxx_fallback:$backslashxx_fallback,backslashxx_patch:$backslashxx_patch,backslashxx_branch_link:$backslashxx_branch_link}' \
            > "$RUNNER_TEMP/variant-package/$VARIANT.json"

      - name: Upload selected LKM artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaap-lkm-${{ needs.metadata.outputs.tag }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/variant-package
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package successful LKM variants
    needs: [metadata, kernel, build-ksu]
    if: ${{ always() && needs.kernel.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download successful LKM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yaap-lkm-${{ needs.metadata.outputs.tag }}-*
          path: ${{ runner.temp }}/variants
          merge-multiple: true

      - name: Download kernel diagnostics
        uses: actions/download-artifact@v4
        with:
          name: yaap-kernel-diagnostics
          path: ${{ runner.temp }}/kernel-diagnostics

      - name: Package available variants
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          KERNEL_COMMIT: ${{ needs.kernel.outputs.kernel_commit }}
          MODULES_COMMIT: ${{ needs.kernel.outputs.modules_commit }}
          KERNEL_RELEASE: ${{ needs.kernel.outputs.kernel_release }}
          MODULE_SIG_PROTECT: ${{ inputs.module_sig_protect }}
        run: |
          set -euxo pipefail
          package="$RUNNER_TEMP/package"
          mkdir -p "$package"
          shopt -s nullglob
          metadata=("$RUNNER_TEMP/variants"/*.json)
          modules=("$RUNNER_TEMP/variants"/*.ko)
          if [ "${#modules[@]}" -eq 0 ]; then
            echo 'No KSU variant completed successfully; nothing to package.' >&2
            exit 1
          fi
          cp "${modules[@]}" "$package/"
          cp "$RUNNER_TEMP/variants"/*.modinfo "$package/" || true
          cp "$RUNNER_TEMP/kernel-diagnostics/yaap-config.txt" "$package/yaap-config.txt"
          jq -s --arg tag "$RELEASE_TAG" \
            --arg kernel_repo "$KERNEL_REPO" --arg kernel_ref "$KERNEL_REF" --arg kernel_commit "$KERNEL_COMMIT" \
            --arg modules_repo "$MODULES_REPO" --arg modules_ref "$MODULES_REF" --arg modules_commit "$MODULES_COMMIT" \
            --arg toolchain "$TOOLCHAIN_URL" --arg kernel_release "$KERNEL_RELEASE" \
            --arg module_sig_protect "$MODULE_SIG_PROTECT" \
            '{release_tag:$tag,kernel:{repo:$kernel_repo,ref:$kernel_ref,commit:$kernel_commit},modules:{repo:$modules_repo,ref:$modules_ref,commit:$modules_commit},toolchain:$toolchain,kernel_release:$kernel_release,module_sig_protect:$module_sig_protect,empty_lkm_versions:true,kallsyms_symbol_checks:true,debug_symbols_stripped:true,variants:map(.variant),ksu:(map({key:(if .variant == "kernelsu" then "official" elif .variant == "kernelsu_next" then "next" else .variant end),value:{ref:.ref,commit:.commit,module:.module,backslashxx_fallback:.backslashxx_fallback,backslashxx_patch:.backslashxx_patch,backslashxx_branch_link:.backslashxx_branch_link}})|from_entries)}' \
            "${metadata[@]}" > "$package/manifest.json"
          (cd "$package" && sha256sum ./*.ko > SHA256SUMS)
          {
            echo "YAAP LKM build: $RELEASE_TAG"
            echo "Kernel release: $KERNEL_RELEASE"
            echo "CONFIG_MODULE_SIG_PROTECT: $MODULE_SIG_PROTECT"
            echo
            echo 'Successful variants:'
            for json in "${metadata[@]}"; do
              jq -r '"- \(.variant): \(.commit[0:12])"' "$json"
            done
            echo
            echo 'Modules:'
            for ko in "$package"/*.ko; do echo "- $(basename "$ko")"; done
            echo
            for variant in kernelsu kernelsu_next bakasu kowx712 backslashxx; do
              if [ ! -s "$RUNNER_TEMP/variants/$variant.json" ]; then
                echo "- $variant: failed or unavailable"
              fi
            done
          } > "$package/README.txt"
          {
            echo "YAAP kernel ($KERNEL_REF): \`${KERNEL_COMMIT:0:12}\`"
            echo "YAAP modules ($MODULES_REF): \`${MODULES_COMMIT:0:12}\`"
            echo
            cat "$package/README.txt"
          } > "$RUNNER_TEMP/release-notes.md"
          echo "PACKAGE_DIR=$package" >> "$GITHUB_ENV"
          find "$package" -maxdepth 1 -type f -printf '%f\n' | sort
          cat "$package/SHA256SUMS"

      - name: Upload combined LKM artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaap-lkm-${{ needs.metadata.outputs.tag }}
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Frieren Kernel Release
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ runner.temp }}/package/*.ko
          fail_on_unmatched_files: true
